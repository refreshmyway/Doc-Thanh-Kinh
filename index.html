.card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.card h2{margin:0;text-align:center;font-size:16px;cursor:pointer}
iframe{width:100%;height:300px;border:0;border-radius:8px;margin-top:10px}
button,.small,footer{display:none!important}

  const box=document.getElementById(target);
